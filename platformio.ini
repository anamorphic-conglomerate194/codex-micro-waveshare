; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; CODEX_STOPWATCH_THIRD_PARTY: this repository is a port to the Waveshare
; ESP32-S3-Touch-AMOLED-1.75C running on Windows. lib_deps are pinned zip
; archives so the build works without git+https shell access (same content as
; the upstream git URLs). The Waveshare touch/audio patches run via
; extra_scripts. The upstream M5Stack StopWatch C152 is NOT the target here.
[platformio]
default_envs = m5stack-stopwatch

[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 1500000
extra_scripts = pre:scripts/patch_m5gfx_amoled_sleep.py
  pre:scripts/patch_m5gfx_waveshare.py
lib_deps =
  M5Unified = https://github.com/m5stack/M5Unified/archive/4fb444784c85791e0b0207701392b42be234b2e7.zip
  M5GFX = https://github.com/m5stack/M5GFX/archive/729297d6e3d657ddc1ec5189bac2f2ea68828085.zip
  M5PM1 = https://github.com/m5stack/M5PM1/archive/be9a5456c007c333e7ac963f33bfde1ffa5d82ee.zip
  M5IOE1 = https://github.com/m5stack/M5IOE1/archive/846eec7d05e25c09013be2acdb8804487f48a62e.zip
  bblanchon/ArduinoJson @ ^6.21.5
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; CODEX_STOPWATCH_THIRD_PARTY: use the stock BLEHIDDevice path (the
  ; upstream project's verified configuration, Arduino-ESP32 2.x). The manual
  ; compact table was a workaround for a misdiagnosed 3.x failure; upstream
  ; pairs and talks HID over this path on the same 2.x framework.
  ; -DCODEX_STOPWATCH_COMPACT_GATT=1
