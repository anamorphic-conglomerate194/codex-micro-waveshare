name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware and gesture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build Waveshare 1.75C firmware
        run: pio run -e m5stack-stopwatch
      - name: Test swipe classification
        run: |
          c++ -std=c++17 -Iinclude simulator/gesture_test.cpp -o /tmp/gesture-test
          /tmp/gesture-test
      - name: Test completion banner expiry
        run: |
          c++ -std=c++17 -Iinclude simulator/completion_banner_test.cpp -o /tmp/completion-banner-test
          /tmp/completion-banner-test
      - name: Test red power-button gestures
        run: |
          c++ -std=c++17 -Iinclude simulator/power_button_gesture_test.cpp -o /tmp/power-button-gesture-test
          /tmp/power-button-gesture-test
      - name: Test connection-health classification
        run: |
          c++ -std=c++17 -Iinclude simulator/connection_health_test.cpp -o /tmp/connection-health-test
          /tmp/connection-health-test
      - name: Test quota payload validation
        run: |
          c++ -std=c++17 -Iinclude -I.pio/libdeps/m5stack-stopwatch/ArduinoJson/src simulator/quota_payload_test.cpp -o /tmp/quota-payload-test
          /tmp/quota-payload-test
      - name: Test host RPC authorization
        run: |
          c++ -std=c++17 -Iinclude -I.pio/libdeps/m5stack-stopwatch/ArduinoJson/src simulator/host_rpc_request_test.cpp -o /tmp/host-rpc-request-test
          /tmp/host-rpc-request-test
